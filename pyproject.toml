[project]
name = "javis-harness"
version = "0.1.0"
description = "Portable development harness for javis (Claude Code + Codex teams)."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harness = "harness.cli:main"
javis = "core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "core", "worklog", "channels", "teams", "brain"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
